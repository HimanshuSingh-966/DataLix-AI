version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./python_backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - /tmp/datalix_exports:/tmp/datalix_exports
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment and map your actual certs here
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
    restart: unless-stopped
